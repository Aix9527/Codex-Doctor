name: release-v8.1.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 运行 V8.1.1 原生回归测试
        shell: pwsh
        run: dotnet run --project '.\versions\v8-native\tests\CodexDoctor.Native.Tests.csproj' -c Release

      - name: 发布 V8.1.1 原生单文件 EXE
        shell: pwsh
        run: |
          Remove-Item '.\dist\v8-native' -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish '.\versions\v8-native\CodexDoctor.Native.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o '.\dist\v8-native'

      - name: 验证 V8.1.1 真正单文件与原生运行合同
        shell: pwsh
        run: |
          $exe = '.\dist\v8-native\CodexDoctor.exe'
          if (-not (Test-Path $exe)) { throw '未生成 CodexDoctor.exe。' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw '输出不是有效 PE EXE。' }

          $forbidden = Get-ChildItem '.\dist\v8-native' -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1','.dll','.runtimeconfig.json','.deps.json' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.FullName }
            throw '发布目录存在外置运行依赖。'
          }

          $manifest = Get-Content '.\versions\v8-native\app.manifest' -Raw
          if ($manifest -notmatch 'requireAdministrator') { throw 'V8.1.1 manifest 未强制管理员权限。' }
          $project = Get-Content '.\versions\v8-native\CodexDoctor.Native.csproj' -Raw
          if ($project -notmatch '<Version>8\.1\.1</Version>') { throw '项目版本不是 8.1.1。' }

          $source = Get-ChildItem '.\versions\v8-native' -Filter '*.cs' -File | Get-Content -Raw
          $joined = $source -join "`n"
          foreach ($token in @('powershell.exe','pwsh.exe','.ps1','.psm1')) {
            if ($joined -match [regex]::Escape($token)) { throw "原生运行时代码包含禁止依赖：$token" }
          }

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.\dist\v8-native\CodexDoctor.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content '.\dist\v8-native\CodexDoctor.exe.sha256' "$hash  CodexDoctor.exe" -Encoding ASCII
          Write-Host "SHA256=$hash"

      - name: 创建 GitHub Release v8.1.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v8.1.1 --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Host 'Release 已存在，跳过发布且不覆盖任何现有资产：v8.1.1'
            exit 0
          }

          gh release create v8.1.1 '.\dist\v8-native\CodexDoctor.exe' '.\dist\v8-native\CodexDoctor.exe.sha256' --target v8.1.1 --title 'Codex Doctor V8.1.1 双向语言与安装管理' --notes-file '.\RELEASE_NOTES_V8.1.1.md' --repo "$env:GITHUB_REPOSITORY"
