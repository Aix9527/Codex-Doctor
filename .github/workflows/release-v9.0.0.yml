name: release-v9.0.0

on:
  push:
    branches: [main]
    paths:
      - 'versions/v9/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASE_NOTES_V9.0.0.md'
      - '.github/workflows/build-v9.yml'
      - '.github/workflows/release-v9.0.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 运行 V9 行为测试
        shell: pwsh
        run: dotnet run --project '.\versions\v9\tests\Tests.csproj' -c Release

      - name: 发布 V9 自包含单文件 EXE
        shell: pwsh
        run: |
          Remove-Item '.\dist\v9' -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish '.\versions\v9\CodexDoctor.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o '.\dist\v9'

      - name: 验证 V9 单文件与发布合同
        shell: pwsh
        run: |
          $exe = '.\dist\v9\CodexDoctorV9.exe'
          if (-not (Test-Path $exe)) { throw '未生成 CodexDoctorV9.exe。' }

          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw '输出不是有效 PE EXE。' }

          $files = @(Get-ChildItem '.\dist\v9' -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'CodexDoctorV9.exe') { throw '发布目录不是单 EXE；请检查构建输出。' }

          $forbidden = Get-ChildItem '.\dist\v9' -Recurse -File | Where-Object { $_.Extension -in '.ps1','.psm1','.dll','.runtimeconfig.json','.deps.json' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error $_.FullName }
            throw '发布目录存在外置运行依赖。'
          }

          $manifest = Get-Content '.\versions\v9\app.manifest' -Raw
          if ($manifest -notmatch 'requireAdministrator') { throw 'V9.0.0 manifest 未强制管理员权限。' }

          $project = Get-Content '.\versions\v9\CodexDoctor.csproj' -Raw
          if ($project -notmatch '<Version>9\.0\.0</Version>') { throw '项目版本不是 9.0.0。' }

          $source = Get-ChildItem '.\versions\v9' -Filter '*.cs' -File | Get-Content -Raw
          $joined = $source -join "`n"
          foreach ($token in @('powershell.exe','pwsh.exe','.ps1','.psm1')) {
            if ($joined -match [regex]::Escape($token)) { throw "原生运行时代码包含禁止依赖：$token" }
          }

      - name: 生成 SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.\dist\v9\CodexDoctorV9.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content '.\dist\v9\CodexDoctorV9.exe.sha256' "$hash  CodexDoctorV9.exe" -Encoding ASCII
          Write-Host "SHA256=$hash"

      - name: 打包 V9 源码
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'codex-doctor-v9-src'
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          robocopy '.\versions\v9' $stage /E /XD bin obj /NFL /NDL /NJH /NJS /NC /NS | Out-Null
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath '.\dist\v9\Codex-Doctor-V9-Source.zip' -Force

      - name: 创建 GitHub Release v9.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v9.0.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = ($LASTEXITCODE -eq 0)
          if ($exists) {
            Write-Host 'Release 已存在，跳过发布且不覆盖任何现有资产：v9.0.0'
            exit 0
          }

          gh release create v9.0.0 '.\dist\v9\CodexDoctorV9.exe' '.\dist\v9\CodexDoctorV9.exe.sha256' '.\dist\v9\Codex-Doctor-V9-Source.zip' '.\docs\V9-使用说明.md' '.\docs\V9-测试与验收记录.md' --target "$env:GITHUB_SHA" --title 'Codex Doctor V9.0.0 Functional Rebuild' --notes-file '.\RELEASE_NOTES_V9.0.0.md' --repo "$env:GITHUB_REPOSITORY"
