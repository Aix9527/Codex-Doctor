name: Bug report
description: Report a Codex Doctor problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Codex Doctor version
      options: [V1, V2, V3, V4, V5]
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: proxy
    attributes:
      label: Proxy client
      placeholder: Clash Verge Rev / Mihomo / v2rayN / none
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not include API keys, tokens, or proxy credentials.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostic output
      description: Remove secrets and personal data before posting.
